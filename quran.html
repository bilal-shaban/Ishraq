<!doctype html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>إشراق - القرآن الكريم</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./ishraq-ui.css" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0b0b0c" />
  </head>
  <body class="ix">
    <header class="ix-top">
      <div class="ix-wrap fixed-top in">
        <a class="logo" href="./index.html" aria-label="إشراق"><img src="./5b862b4281f64fd884b11984846f0e97.png" alt="إشراق" /></a>
        <nav class="ix-links" aria-label="التنقل الرئيسي"><a href="./index.html">الرئيسية</a><a class="on" href="./quran.html">القرآن</a><a href="./hadith.html">الحديث</a><a href="./azkar.html">الأذكار</a><a href="./awrad.html">الأوراد</a><a href="./adiya.html">الأدعية</a><a href="./tasbeeh.html">السبحة</a><a href="./matwaf.html">المطوف</a></nav>
        <span class="sp"></span>
        <a class="ix-ib" href="./favorites.html" aria-label="المفضلة" title="المفضلة"><i class="bi bi-star"></i></a>
        <a class="ix-ib" href="./settings.html" aria-label="الإعدادات" title="الإعدادات"><i class="bi bi-gear"></i></a>
      </div>
    </header>

    <main class="ix-wrap">
      <section class="ix-qhead">
        <div class="ix-hello">QURAN KAREEM</div>
        <h1 class="ix-tag">القرآن <span class="ol">الكريم</span></h1>
      </section>

      <!-- البحث -->
      <div class="ix-search">
        <i class="bi bi-search s"></i>
        <input type="text" id="quran-search-input" placeholder="ابحث عن اسم السورة..." autocomplete="off" />
        <button id="voice-search-btn" class="ix-ib" type="button" title="بحث صوتي" aria-label="بحث صوتي"><i class="bi bi-mic-fill"></i></button>
      </div>

      <!-- آخر السور المقروءة -->
      <div class="ix-recent d-none" id="recent-surahs-row">
        <div class="ix-lab"><i class="bi bi-clock-history"></i> آخر ما قرأت</div>
        <div class="d-flex gap-2 flex-wrap" id="recent-surahs-list"></div>
      </div>

      <!-- متتبع الختمة -->
      <div class="ix-card hl ix-khatmah">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="ix-kicker mb-0"><i class="bi bi-graph-up"></i> متتبع الختمة</span>
          <button class="btn btn-sm btn-gold-outline" data-bs-toggle="modal" data-bs-target="#bookmarks-modal"><i class="bi bi-bookmark-fill"></i> علاماتي المرجعية</button>
        </div>
        <div class="progress mb-2"><div id="khatmah-progress-bar" class="progress-bar bg-gold" style="width: 0%"></div></div>
        <div class="small" style="color:var(--m)" id="khatmah-status-text">ابدأ القراءة ليبدأ التتبع...</div>
      </div>

      <!-- طريقة الفهرسة -->
      <div class="ix-seg">
        <button id="index-by-surah-btn" class="btn btn-gold-solid btn-sm">حسب السورة</button>
        <button id="index-by-juz-btn" class="btn btn-gold-outline btn-sm">حسب الجزء</button>
      </div>

      <div class="row g-2 mb-3 d-none" id="juz-container"></div>

      <div class="row g-2" id="surahs-container">
        <div class="text-center py-5" style="color:var(--m)">
          <div class="spinner-border" role="status" style="color:var(--a)"><span class="visually-hidden">جاري التحميل...</span></div>
          <p class="mt-2">جاري جلب سور القرآن الكريم...</p>
        </div>
      </div>
    </main>

    <!-- نافذة العلامات المرجعية -->
    <div class="modal fade" id="bookmarks-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content bg-dark border border-gold-subtle">
          <div class="modal-header border-bottom border-gold-subtle">
            <h5 class="modal-title gold"><i class="bi bi-bookmark-fill me-1"></i> علاماتي المرجعية</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="bookmarks-modal-body"></div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav d-md-none" aria-label="التنقل السفلي">
      <div class="container d-flex justify-content-around align-items-center">
        <a href="index.html" class="nav-item-bottom text-center text-decoration-none" data-page="home"><i class="bi bi-house-door d-block"></i><i class="bi bi-house-door-fill d-block active-icon"></i><span>الرئيسية</span></a>
        <a href="quran.html" class="nav-item-bottom text-center text-decoration-none active" data-page="quran"><i class="bi bi-book d-block"></i><i class="bi bi-book-fill d-block active-icon"></i><span>القرآن</span></a>
        <a href="tasbeeh.html" class="nav-item-bottom text-center text-decoration-none" data-page="tasbeeh"><i class="bi bi-circle d-block"></i><i class="bi bi-record-circle-fill d-block active-icon"></i><span>السبحة</span></a>
        <a href="qibla.html" class="nav-item-bottom text-center text-decoration-none" data-page="qibla"><i class="bi bi-compass d-block"></i><i class="bi bi-compass-fill d-block active-icon"></i><span>القبلة</span></a>
        <a href="matwaf.html" class="nav-item-bottom text-center text-decoration-none" data-page="matwaf"><i class="bi bi-person-walking d-block"></i><i class="bi bi-person-walking d-block active-icon"></i><span>المطوف</span></a>
      </div>
    </nav>
    <!-- JavaScript الخاص بالإعدادات -->
   
    <script src="./quran.js"></script>
    <script src="./main.js"></script>
    <script src="./ishraq-ui.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
