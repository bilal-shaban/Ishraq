<!doctype html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>قراءة السورة - إشراق</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./ishraq-ui.css" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0b0b0c" />
  </head>
  <body class="ix reader">
    <script>try{if(localStorage.getItem('ix_reader_theme')==='paper')document.body.classList.add('paper')}catch(e){}</script>
    <header class="ix-top">
      <div class="ix-wrap fixed-top in">
        <a class="ix-ib" href="./quran.html" aria-label="العودة للسور" title="العودة للسور"><i class="bi bi-chevron-right"></i></a>
        <div id="surah-top-title" class="ix-stitle">جاري تحميل السورة...</div>
        <span class="sp"></span>
        <a class="ix-ib" href="./favorites.html" aria-label="المفضلة" title="المفضلة"><i class="bi bi-star"></i></a>
      </div>
    </header>

    <!-- شريط التحكم -->
    <div class="reader-bar">
      <div class="ix-wrap">
        <div class="rb-row">
          <select id="reciter-select" class="form-select form-select-sm" title="اختيار القارئ" aria-label="القارئ"></select>
          <button id="audio-play-btn" class="btn btn-gold-solid btn-sm" title="استماع لتلاوة السورة"><i class="bi bi-play-fill"></i> استماع للسورة</button>
          <button id="display-options-btn" class="ix-ib" type="button" title="خيارات العرض" aria-label="خيارات العرض" data-bs-toggle="collapse" data-bs-target="#display-options-panel" aria-expanded="false"><i class="bi bi-sliders"></i></button>
          <button id="focus-mode-btn" class="ix-ib" type="button" title="وضع القراءة المركزة" aria-label="وضع القراءة المركزة"><i class="bi bi-arrows-fullscreen"></i></button>
        </div>
        <div class="collapse" id="display-options-panel">
          <div class="rb-opts">
            <button id="ix-theme-btn" class="btn btn-gold-outline btn-sm" type="button" title="تبديل خلفية القراءة"><i class="bi bi-sun"></i> الوضع الورقي</button>
            <button id="toggle-layout-btn" class="btn btn-gold-outline btn-sm"><i class="bi bi-book"></i> شكل المصحف الشريف</button>
            <button id="auto-advance-btn" class="btn btn-gold-outline btn-sm" title="تشغيل تلقائي متسلسل للسورة التالية"><i class="bi bi-skip-forward"></i> تشغيل تلقائي: متوقف</button>
            <a id="download-audio-link" href="#" download class="btn btn-gold-outline btn-sm d-none" title="تنزيل الصوت للاستماع بدون إنترنت"><i class="bi bi-download"></i> تنزيل الصوت</a>
            <button id="toggle-font-family-btn" class="btn btn-gold-outline btn-sm" title="تبديل نوع الخط"><i class="bi bi-fonts"></i> الرسم العثماني</button>
            <div class="rb-font" role="group" aria-label="حجم الخط">
              <button id="font-decrease-btn" class="btn btn-gold-outline btn-sm" title="تصغير الخط"><i class="bi bi-dash-lg"></i></button>
              <span id="font-size-indicator" class="fs">100%</span>
              <button id="font-increase-btn" class="btn btn-gold-outline btn-sm" title="تكبير الخط"><i class="bi bi-plus-lg"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- محتوى الآيات -->
    <main id="surah-main">
      <div class="ix-wrap ix-read">
        <div id="bismillah-container" class="text-center d-none">
          <h3>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</h3>
          <div class="orn"><i></i><b>۞</b><i></i></div>
        </div>
        <div id="ayahs-container">
          <div class="text-center py-5" style="color:var(--m)">
            <div class="spinner-border" role="status" style="color:var(--a)"><span class="visually-hidden">جاري التحميل...</span></div>
            <p class="mt-2">جاري جلب آيات السورة...</p>
          </div>
        </div>

        <div class="ix-pn">
          <a id="ix-prev" class="btn btn-gold-outline d-none" href="#"><i class="bi bi-arrow-right"></i> السورة السابقة</a>
          <a id="ix-next" class="btn btn-gold-solid d-none" href="#">السورة التالية <i class="bi bi-arrow-left"></i></a>
        </div>
      </div>
    </main>

    <!-- مشغّل التلاوة العائم -->
    <div id="audio-progress-wrap" class="ix-player d-none">
      <div class="pl-top">
        <small id="audio-ayah-indicator">تلاوة السورة كاملة</small>
        <button id="audio-stop-btn" class="ix-ib" type="button" title="إيقاف التلاوة" aria-label="إيقاف التلاوة"><i class="bi bi-stop-fill"></i></button>
      </div>
      <div id="audio-seek-row" class="pl-seek">
        <small id="audio-current-time">00:00</small>
        <input type="range" id="audio-seek" class="form-range" min="0" max="100" value="0" step="1" />
        <small id="audio-total-time">00:00</small>
      </div>
      <div class="pl-bot">
        <span class="pl-vol"><i class="bi bi-volume-up"></i><input type="range" id="audio-volume" class="form-range" min="0" max="1" step="0.05" value="1" /></span>
        <span class="pl-who">بصوت الشيخ <b id="audio-reciter-label">مشاري العفاسي</b></span>
      </div>
    </div>
    <audio id="surah-audio" preload="none"></audio>

    <nav class="bottom-nav d-md-none" aria-label="التنقل السفلي">
      <div class="container d-flex justify-content-around align-items-center">
        <a href="index.html" class="nav-item-bottom text-center text-decoration-none" data-page="home"><i class="bi bi-house-door d-block"></i><i class="bi bi-house-door-fill d-block active-icon"></i><span>الرئيسية</span></a>
        <a href="quran.html" class="nav-item-bottom text-center text-decoration-none active" data-page="quran"><i class="bi bi-book d-block"></i><i class="bi bi-book-fill d-block active-icon"></i><span>القرآن</span></a>
        <a href="tasbeeh.html" class="nav-item-bottom text-center text-decoration-none" data-page="tasbeeh"><i class="bi bi-circle d-block"></i><i class="bi bi-record-circle-fill d-block active-icon"></i><span>السبحة</span></a>
        <a href="qibla.html" class="nav-item-bottom text-center text-decoration-none" data-page="qibla"><i class="bi bi-compass d-block"></i><i class="bi bi-compass-fill d-block active-icon"></i><span>القبلة</span></a>
        <a href="matwaf.html" class="nav-item-bottom text-center text-decoration-none" data-page="matwaf"><i class="bi bi-person-walking d-block"></i><i class="bi bi-person-walking d-block active-icon"></i><span>المطوف</span></a>
      </div>
    </nav>

    <!-- نافذة التفسير المختصر -->
    <div class="modal fade" id="tafsir-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content bg-dark border border-gold-subtle">
          <div class="modal-header border-bottom border-gold-subtle">
            <h5 class="modal-title gold"><i class="bi bi-chat-square-text me-1"></i> تفسير مختصر</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="tafsir-modal-body"></div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./surah-reader.js"></script>
    <script src="./main.js"></script>
    <script src="./ishraq-ui.js"></script>
    <script>
      // السورة السابقة / التالية
      (function () {
        var n = parseInt(new URLSearchParams(location.search).get("surah")) || 1;
        var prev = document.getElementById("ix-prev"), next = document.getElementById("ix-next");
        if (n > 1) { prev.href = "surah-reader.html?surah=" + (n - 1); prev.classList.remove("d-none"); }
        if (n < 114) { next.href = "surah-reader.html?surah=" + (n + 1); next.classList.remove("d-none"); }
      })();
    </script>
  </body>
</html>
