<!doctype html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>الأدعية - إشراق</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./ishraq-ui.css" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0b0b0c" />
  </head>

  <body class="ix">
    <header class="ix-top">
      <div class="ix-wrap fixed-top in">
        <a class="logo" href="./index.html" aria-label="إشراق"><img src="./5b862b4281f64fd884b11984846f0e97.png" alt="إشراق" /></a>
        <nav class="ix-links" aria-label="التنقل الرئيسي"><a href="./index.html">الرئيسية</a><a href="./quran.html">القرآن</a><a href="./hadith.html">الحديث</a><a href="./azkar.html">الأذكار</a><a href="./awrad.html">الأوراد</a><a class="on" href="./adiya.html">الأدعية</a><a href="./tasbeeh.html">السبحة</a><a href="./matwaf.html">المطوف</a></nav>
        <span class="sp"></span>
        <a class="ix-ib" href="./favorites.html" aria-label="المفضلة" title="المفضلة"><i class="bi bi-star"></i></a>
        <a class="ix-ib" href="./settings.html" aria-label="الإعدادات" title="الإعدادات"><i class="bi bi-gear"></i></a>
      </div>
    </header>
    <div class="ix-wrap"><section class="ix-qhead"><div class="ix-hello">DUAA</div><h1 class="ix-tag">الأدعية <span class="ol">المأثورة</span></h1></section></div>

    <!-- الهيدر العلوي الموحد -->

    <!-- دعاء اليوم -->
    <div class="container">
      <div class="supplication-box p-3 rounded-4 mt-3 mb-3" id="daily-dua-box">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <small class="gold fw-bold"><i class="bi bi-sun-fill me-1"></i> دعاء اليوم</small>
          <div class="d-flex gap-1">
            <button class="btn btn-sm btn-outline-light border-0 py-0 px-2" id="daily-dua-copy-btn" title="نسخ"><i class="bi bi-copy"></i></button>
            <button class="btn btn-sm btn-outline-light border-0 py-0 px-2 text-success" id="daily-dua-share-img-btn" title="مشاركة كصورة"><i class="bi bi-image"></i></button>
          </div>
        </div>
        <p class="zikr-text mb-0" id="daily-dua-text" style="font-size: 1.3rem;"></p>
      </div>

      <!-- البحث -->
      <div class="input-group mb-3">
        <span class="input-group-text bg-dark border-gold-subtle" style="color: #edcea0;"><i class="bi bi-search"></i></span>
        <input type="text" id="dua-search-input" class="form-control  text-light border-gold-subtle shadow-none" style="background-color: #21211d;" placeholder="ابحث داخل كل الأدعية...">
      </div>

      <!-- فرز حسب الطول -->
      <div class="d-flex gap-2 mb-3">
        <button class="btn btn-gold-outline btn-sm length-filter-btn active-tab" data-length="all">الكل</button>
        <button class="btn btn-gold-outline btn-sm length-filter-btn" data-length="short">قصيرة</button>
        <button class="btn btn-gold-outline btn-sm length-filter-btn" data-length="long">طويلة</button>
      </div>
    </div>

    <!-- شريط التبويبات -->
    <div class="container">
      <div class="d-flex category-tabs gap-2 mb-3" id="category-tabs"></div>

      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <small class="zikr-progress-note" id="progress-note">0 / 0 تم إنجازها</small>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-gold-outline btn-sm" title="أدعيتي الشخصية" data-bs-toggle="modal" data-bs-target="#addPersonalDuaModal">
            <i class="bi bi-journal-plus"></i>
          </button>
          <a href="./favorites.html" class="btn btn-gold-outline btn-sm" title="المفضلة">
            <i class="bi bi-star-fill"></i>
          </a>
          <div class="btn-group" role="group" aria-label="حجم الخط">
            <button id="font-decrease-btn" class="btn btn-gold-outline btn-sm" title="تصغير الخط"><i class="bi bi-dash-lg"></i></button>
            <button id="font-increase-btn" class="btn btn-gold-outline btn-sm" title="تكبير الخط"><i class="bi bi-plus-lg"></i></button>
          </div>
          <button id="reset-category-btn" class="btn btn-gold-outline btn-sm" title="إعادة ضبط عدّادات هذه الفئة">
            <i class="bi bi-arrow-counterclockwise"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- محتوى الأذكار -->
    <main class="pb-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-lg-9">
            <div id="zikr-container"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- نافذة إضافة دعاء شخصي -->
    <div class="modal fade" id="addPersonalDuaModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark border border-gold-subtle">
          <div class="modal-header border-bottom border-gold-subtle">
            <h5 class="modal-title gold"><i class="bi bi-journal-plus me-1"></i> أدعيتي الشخصية</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <textarea id="personal-dua-input" class="form-control bg-dark text-light border-gold-subtle shadow-none mb-3" rows="3" placeholder="اكتب دعاءك هنا..."></textarea>
            <button type="button" class="btn btn-gold-solid w-100" id="save-personal-dua-btn">حفظ الدعاء</button>
          </div>
        </div>
      </div>
    </div>

    <!-- نافذة مشاركة الدعاء كصورة -->
    <div class="modal fade" id="shareImageModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark border border-gold-subtle">
          <div class="modal-header border-bottom border-gold-subtle">
            <h5 class="modal-title gold"><i class="bi bi-image me-1"></i> مشاركة كصورة</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body text-center">
            <canvas id="dua-share-canvas" width="600" height="600" class="w-100 rounded-3 mb-3" style="max-width: 320px;"></canvas>
            <a id="dua-share-download-link" class="btn btn-gold-solid w-100" download="دعاء-اشراق.png">
              <i class="bi bi-download me-1"></i> حفظ الصورة
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- شريط التنقل السفلي الثابت -->
    <nav class="bottom-nav d-md-none" aria-label="التنقل السفلي">
      <div class="container d-flex justify-content-around align-items-center">
        <a href="index.html" class="nav-item-bottom text-center text-decoration-none" data-page="home"><i class="bi bi-house-door d-block"></i><i class="bi bi-house-door-fill d-block active-icon"></i><span>الرئيسية</span></a>
        <a href="quran.html" class="nav-item-bottom text-center text-decoration-none" data-page="quran"><i class="bi bi-book d-block"></i><i class="bi bi-book-fill d-block active-icon"></i><span>القرآن</span></a>
        <a href="tasbeeh.html" class="nav-item-bottom text-center text-decoration-none" data-page="tasbeeh"><i class="bi bi-circle d-block"></i><i class="bi bi-record-circle-fill d-block active-icon"></i><span>السبحة</span></a>
        <a href="qibla.html" class="nav-item-bottom text-center text-decoration-none" data-page="qibla"><i class="bi bi-compass d-block"></i><i class="bi bi-compass-fill d-block active-icon"></i><span>القبلة</span></a>
        <a href="matwaf.html" class="nav-item-bottom text-center text-decoration-none" data-page="matwaf"><i class="bi bi-person-walking d-block"></i><i class="bi bi-person-walking d-block active-icon"></i><span>المطوف</span></a>
      </div>
    </nav>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./main.js"></script>
    <script src="./ishraq-ui.js"></script>
    <script src="./adiya.js"></script>
  </body>
</html>
